[package]
name = "rbs-core"
description = "Runtime partagé des projets générés par rbs : erreurs, configuration, logs, middlewares."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Le pilote par défaut reste PostgreSQL : un projet antérieur au choix du moteur n'en
# nomme aucun, et doit continuer de compiler tel quel.
default = ["postgres"]

postgres = ["sea-orm/sqlx-postgres"]
mysql = ["sea-orm/sqlx-mysql"]
sqlite = ["sea-orm/sqlx-sqlite"]

auth = ["dep:argon2", "dep:base64", "dep:jsonwebtoken", "dep:rand", "dep:sha2"]

# Vides et sans dépendances : les nommer réserve le nom sans figer, un an à l'avance,
# les crates que leur implémentation utilisera.
redis = []
mail = []
storage = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
argon2 = { workspace = true, optional = true }
axum.workspace = true
base64 = { workspace = true, optional = true }
dotenvy.workspace = true
figment.workspace = true
jsonwebtoken = { workspace = true, optional = true }
nu-ansi-term.workspace = true
rand = { workspace = true, optional = true }
sea-orm.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "chrono", "env-filter"] }
ulid.workspace = true
utoipa.workspace = true
validator.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

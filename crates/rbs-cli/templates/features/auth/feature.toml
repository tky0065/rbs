[feature]
description = "authentification JWT : Argon2, jetons d'accès et de rafraîchissement, rôles"
# `/auth/login` hache un Argon2 même pour un email inconnu — c'est ce qui empêche
# d'énumérer les comptes, et c'est aussi 19 Mio par requête anonyme. Sans limite de débit,
# la protection contre l'énumération est un déni de service offert au premier venu : le
# fragment vient donc avec, et le plan de `rbs add auth` le montre.
requires = ["rate-limit"]

[[files]]
source      = "mod.rs.jinja"
destination = "src/auth/mod.rs"

[[files]]
source      = "model.rs.jinja"
destination = "src/auth/model.rs"

[[files]]
source      = "dto.rs.jinja"
destination = "src/auth/dto.rs"

[[files]]
source      = "repository.rs.jinja"
destination = "src/auth/repository.rs"

[[files]]
source      = "service.rs.jinja"
destination = "src/auth/service.rs"

[[files]]
source      = "controller.rs.jinja"
destination = "src/auth/controller.rs"

[[files]]
source      = "guard.rs.jinja"
destination = "src/auth/guard.rs"

[[files]]
source      = "tests.rs.jinja"
destination = "src/auth/tests.rs"

[[anchors]]
anchor  = "features"
content = "pub mod auth;"

[[anchors]]
anchor  = "routes"
content = ".merge(crate::auth::routes())"

[[anchors]]
anchor  = "openapi"
content = """
crate::auth::controller::register,
crate::auth::controller::login,
crate::auth::controller::refresh,
crate::auth::controller::logout,
crate::auth::controller::me,
"""

[migration]
source = "migration.rs.jinja"
name   = "create_auth_tables"

[cargo.rbs-core]
features = ["auth"]

[[config]]
file    = "config/default.toml"
section = "auth"
content = """
access_ttl_secs = 900
refresh_ttl_secs = 2592000
"""

[[env]]
key     = "RBS_AUTH__SECRET"
value   = "changez-moi-par-un-secret-tire-au-hasard-de-32-octets-au-moins"
secret  = true
comment = "Secret de signature HS256. 32 octets au moins, sans quoi le démarrage échoue."

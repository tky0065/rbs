[feature]
description = "authentification JWT : Argon2, jetons d'accès et de rafraîchissement, rôles"
# `/auth/login` hache un Argon2 même pour un email inconnu — c'est ce qui empêche
# d'énumérer les comptes, et c'est aussi 19 Mio par requête anonyme. Sans limite de débit,
# la protection contre l'énumération est un déni de service offert au premier venu : le
# fragment vient donc avec, et le plan de `rbs add auth` le montre.
#
# `auth` envoie trois courriels — le lien de réinitialisation, celui de vérification, et
# l'avertissement d'une inscription tentée sur une adresse prise — et aucun de ces
# parcours n'a de sens sans destinataire. La dépendance est dure plutôt qu'optionnelle :
# un point d'extension resté vide rendrait 202 sans que rien ne parte.
requires = ["rate-limit", "mail"]
# Le seul endroit où les identifiants du compte d'administration se disent : le mot de
# passe est tiré à l'installation, et le `.env` qui le porte est gitignoré — personne ne
# le lira s'il n'est pas nommé ici.
next_steps = [
  "{% if lang == 'en' %}rbs seed writes the admin account into the users table: ADMIN_EMAIL (admin@{@ project_name @}.test) and ADMIN_PASSWORD, drawn into your .env, are the credentials the sign-in screen asks for{% else %}rbs seed pose le compte d'administration dans la table des comptes : ADMIN_EMAIL (admin@{@ project_name @}.test) et ADMIN_PASSWORD, tiré dans votre .env, sont les identifiants que l'écran de connexion demande{% endif %}",
]


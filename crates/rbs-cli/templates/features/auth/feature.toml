[[anchors]]
anchor  = "features"
content = "pub mod auth;"

[[anchors]]
anchor  = "routes"
content = ".merge(crate::auth::routes())"

[[anchors]]
anchor  = "openapi"
content = """
crate::auth::controller::register,
crate::auth::controller::login,
crate::auth::controller::refresh,
crate::auth::controller::logout,
crate::auth::controller::me,
crate::auth::controller::password::change_password,
crate::auth::controller::password::forgot_password,
crate::auth::controller::password::reset_password,
crate::auth::controller::verification::verify_email,
crate::auth::controller::verification::resend_verification,
crate::auth::controller::list_sessions,
crate::auth::controller::revoke_session,
crate::auth::controller::revoke_sessions,
"""

[[anchors]]
anchor  = "state_champs"
content = "pub flows: crate::auth::config::FlowConfig,"

[[anchors]]
anchor  = "state_init"
content = "flows: crate::auth::config::FlowConfig::from_config()?,"

[migration]
source = "migration.rs.jinja"
name   = "create_auth_tables"

[cargo.rbs-core]
features = ["auth"]

# Les émissions de jetons partent en tâche détachée, et les tests du fragment attendent
# qu'elles aient écrit.
[cargo.tokio]
features = ["time"]

[[config]]
file    = "config/default.toml"
section = "auth"
content = """
access_ttl_secs = 900
refresh_ttl_secs = 2592000

# Une heure : le lien de réinitialisation est urgent, et sa fenêtre est la durée pendant
# laquelle une boîte compromise vaut le compte.
reset_ttl_secs = 3600

# Un jour : la vérification ne l'est pas, et un lien trop court fait revenir l'utilisateur
# sur `resend-verification` plus souvent qu'il n'ouvre son courrier.
verification_ttl_secs = 86400

# L'application du client, et non ce serveur : rbs engendre une API, et le lien du
# courriel mène à l'écran qui postera le jeton.
app_url = "http://localhost:3000"
"""

[[env]]
key     = "RBS_AUTH__SECRET"
value   = "changez-moi-par-un-secret-tire-au-hasard-de-32-octets-au-moins"
secret  = true
comment = "Secret de signature HS256. 32 octets au moins, sans quoi le démarrage échoue."

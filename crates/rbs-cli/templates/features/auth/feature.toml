[cargo.rbs-core]
features = ["auth"]

# Les émissions de jetons partent en tâche détachée, et les tests du fragment attendent
# qu'elles aient écrit.
[cargo.tokio]
features = ["time"]

[[config]]
file    = "config/default.toml"
section = "auth"
content = """
access_ttl_secs = 900
refresh_ttl_secs = 2592000

# Une heure : le lien de réinitialisation est urgent, et sa fenêtre est la durée pendant
# laquelle une boîte compromise vaut le compte.
reset_ttl_secs = 3600

# Un jour : la vérification ne l'est pas, et un lien trop court fait revenir l'utilisateur
# sur `resend-verification` plus souvent qu'il n'ouvre son courrier.
verification_ttl_secs = 86400

# L'application du client, et non ce serveur : rbs engendre une API, et le lien du
# courriel mène à l'écran qui postera le jeton. Le binaire sert le frontend construit sur
# le port du serveur ; en développement, Vite tient le sien, d'où la clé dédoublée dans
# config/development.toml.
app_url = "http://localhost:8080"

# Ouvre `POST /auth/register`. `false` la ferme côté serveur — la route refuse avant de
# lire l'adresse — et non côté écran seulement : un interrupteur qui ne masquerait qu'un
# bouton laisserait l'inscription ouverte à qui poste directement. Le shell
# d'administration, lui, cesse alors d'offrir son écran d'inscription.
registration_enabled = true

# Une adresse non vérifiée ne se connecte pas : sans cette règle, `register` suivi de
# `login` avec le même mot de passe dirait si l'adresse était déjà inscrite. `false`
# connecte dès l'inscription, et rouvre cet écart.
#
# Le profil de développement la met à `false` : le compte que `rbs seed` pose est vérifié
# d'emblée, mais un compte inscrit par l'API ne l'est pas, et aucun écran n'appelle
# `/auth/verify-email`. L'écart ne s'ouvre que sur un poste de travail ; ce défaut-ci,
# qui gouverne la production, garde la preuve d'adresse.
login_requires_verification = true
"""

# Les deux clés que le poste de travail contredit. Un profil ne remplace que ce qu'il
# nomme : le reste de `[auth]` vient toujours du fichier ci-dessus.
[[config]]
file    = "config/development.toml"
section = "auth"
content = """
# Le port de Vite, qui sert le client en développement.
app_url = "http://localhost:5173"

# Le poste de travail connecte dès l'inscription : sans cela, un compte créé par l'API ne
# pourrait jamais entrer, faute d'écran appelant `/auth/verify-email`.
login_requires_verification = false
"""

[[env]]
key     = "RBS_AUTH__SECRET"
value   = "changez-moi-par-un-secret-tire-au-hasard-de-32-octets-au-moins"
secret  = true
comment = "Secret de signature HS256. 32 octets au moins, sans quoi le démarrage échoue."

# Déduite du projet et non tirée : un tirage rendrait soixante-quatre caractères
# hexadécimaux sans `@`, que l'écran de connexion refuse avant même de partir. L'adresse
# n'est pas un secret — le mot de passe ci-dessous l'est.
[[env]]
key           = "ADMIN_EMAIL"
value         = "admin@example.com"
project_value = "admin@{@ project_name @}.test"
comment       = "Le compte d'administration que `rbs seed` pose dans la table des comptes"

[[env]]
key     = "ADMIN_PASSWORD"
value   = "changez-moi-ce-mot-de-passe-est-publie-dans-git"
secret  = true
comment = "Son mot de passe, tiré au hasard dans le .env — l'exemple versionné n'en porte qu'un repère"

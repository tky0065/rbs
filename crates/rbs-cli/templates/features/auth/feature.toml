[feature]
description = "authentification JWT : Argon2, jetons d'accès et de rafraîchissement, rôles"

[[fichiers]]
source = "mod.rs.jinja"
cible  = "src/auth/mod.rs"

[[fichiers]]
source = "model.rs.jinja"
cible  = "src/auth/model.rs"

[[fichiers]]
source = "dto.rs.jinja"
cible  = "src/auth/dto.rs"

[[fichiers]]
source = "repository.rs.jinja"
cible  = "src/auth/repository.rs"

[[fichiers]]
source = "service.rs.jinja"
cible  = "src/auth/service.rs"

[[fichiers]]
source = "controller.rs.jinja"
cible  = "src/auth/controller.rs"

[[fichiers]]
source = "guard.rs.jinja"
cible  = "src/auth/guard.rs"

[[fichiers]]
source = "tests.rs.jinja"
cible  = "src/auth/tests.rs"

[[ancres]]
ancre   = "features"
contenu = "mod auth;"

[[ancres]]
ancre   = "routes"
contenu = ".merge(crate::auth::routes())"

[[ancres]]
ancre   = "openapi"
contenu = """
crate::auth::controller::register,
crate::auth::controller::login,
crate::auth::controller::refresh,
crate::auth::controller::logout,
crate::auth::controller::me,
"""

[migration]
source = "migration.rs.jinja"
nom    = "create_auth_tables"

[cargo.rbs-core]
features = ["auth"]

[[config]]
fichier = "config/default.toml"
section = "auth"
contenu = """
access_ttl_secs = 900
refresh_ttl_secs = 2592000
"""

[[env]]
cle         = "RBS_AUTH__SECRET"
valeur      = "changez-moi-par-un-secret-tire-au-hasard-de-32-octets-au-moins"
commentaire = "Secret de signature HS256. 32 octets au moins, sans quoi le démarrage échoue."

[feature]
description = "envoi de courriels par SMTP : transport partagé, gabarits minijinja"

[[files]]
source      = "mod.rs.jinja"
destination = "src/mail/mod.rs"

[[files]]
source      = "config.rs.jinja"
destination = "src/mail/config.rs"

[[files]]
source      = "template.rs.jinja"
destination = "src/mail/template.rs"

[[files]]
source      = "service.rs.jinja"
destination = "src/mail/service.rs"

[[files]]
source      = "tests.rs.jinja"
destination = "src/mail/tests.rs"

# Le gabarit est déposé dans le projet, non embarqué dans un binaire : c'est un texte que
# son auteur relit et récrit.
[[files]]
source      = "bienvenue.html.jinja"
destination = "templates/mail/bienvenue.html"

[[anchors]]
anchor  = "features"
content = "mod mail;"

[[anchors]]
anchor  = "state_champs"
content = """
// Le transport n'a pas encore de lecteur : ce sont les handlers du projet qui en seront.
#[allow(dead_code)]
pub mail: crate::mail::Mailer,
"""

[[anchors]]
anchor  = "state_init"
content = "mail: crate::mail::Mailer::from_config()?,"

# `default_features = false` : les défauts de `lettre` activent `native-tls`, qui réclame
# OpenSSL sur les trois plateformes de la CI. `ring` et `webpki-roots` ne sont pas
# facultatives — `rustls` refuse de compiler sans un fournisseur cryptographique ni un
# magasin de racines, et ces deux-là sont les seuls à ne rien demander au système.
[[dependencies]]
name             = "lettre"
version          = "0.11"
default_features = false
features         = [
    "smtp-transport",
    "builder",
    "pool",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
]

# `loader` ne fait pas partie des défauts de la crate, et `path_loader` en dépend.
[[dependencies]]
name     = "minijinja"
version  = "2.24"
features = ["loader"]

[[config]]
file    = "config/default.toml"
section = "mail"
content = """
# Mailpit et MailHog écoutent sur 1025, en clair : c'est le serveur de développement.
# En production, `tls = "starttls"` et un `smtp_user` — dont le mot de passe vient de
# RBS_MAIL__SMTP_PASSWORD, et jamais de ce fichier, qui est versionné.
smtp_host = "localhost"
smtp_port = 1025
smtp_user = ""
tls = "none"
from = "no-reply@localhost"
timeout_secs = 10
templates = "templates/mail"
"""

[[env]]
key     = "RBS_MAIL__SMTP_PASSWORD"
value   = ""
comment = "Mot de passe du compte SMTP. Reste vide tant que `smtp_user` l'est."

# Mailpit et non un vrai SMTP : il accepte tout, n'envoie rien, et montre sur 8025 ce que
# le projet a cru envoyer. C'est le serveur que `smtp_port = 1025` désignait déjà.
[[anchors]]
anchor  = "services"
content = """
mailpit:
  image: axllent/mailpit:latest
  ports:
    - "1025:1025"
    - "8025:8025"
"""

[feature]
description = "stockage d'objets : un trait à cinq méthodes, deux backends — fichiers et S3"

[[files]]
source      = "mod.rs.jinja"
destination = "src/storage/mod.rs"

[[files]]
source      = "files.rs.jinja"
destination = "src/storage/files.rs"

[[files]]
source      = "s3.rs.jinja"
destination = "src/storage/s3.rs"

[[files]]
source      = "tests.rs.jinja"
destination = "src/storage/tests.rs"

[[anchors]]
anchor  = "features"
content = "pub mod storage;"

[[anchors]]
anchor  = "state_champs"
content = """
#[allow(dead_code)]
pub storage: std::sync::Arc<dyn crate::storage::Storage>,
"""

[[anchors]]
anchor  = "state_init"
content = "storage: crate::storage::from_config()?,"

# Sans cette sonde, `/health` répondrait `ok` sur un bucket injoignable et l'orchestrateur
# garderait le pod en rotation.
[[anchors]]
anchor  = "health_probes"
content = 'rbs_core::health::Probe::new("storage", crate::storage::probe(&state.storage)),'

[[dependencies]]
name    = "async-trait"
version = "0.1"

[[dependencies]]
name    = "thiserror"
version = "2.0"

[[dependencies]]
name    = "aws-sdk-s3"
version = "1.144"

[cargo.tokio]
features = ["fs"]

[[config]]
file    = "config/default.toml"
section = "storage"
content = """
backend = "fs"
root = "./storage"
"""

[[env]]
key     = "RBS_STORAGE__BUCKET"
value   = "demo"
comment = "Backend `s3` : sans effet tant que storage.backend vaut \"fs\"."

[[env]]
key   = "RBS_STORAGE__ACCESS_KEY_ID"
value = "changez-moi"

[[env]]
key   = "RBS_STORAGE__SECRET_ACCESS_KEY"
value = "changez-moi"

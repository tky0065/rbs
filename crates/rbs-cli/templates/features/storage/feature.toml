[feature]
description = "stockage d'objets : un trait à quatre méthodes, deux backends — fichiers et S3"

[[fichiers]]
source = "mod.rs.jinja"
cible  = "src/storage/mod.rs"

[[fichiers]]
source = "fichiers.rs.jinja"
cible  = "src/storage/fichiers.rs"

[[fichiers]]
source = "s3.rs.jinja"
cible  = "src/storage/s3.rs"

[[fichiers]]
source = "tests.rs.jinja"
cible  = "src/storage/tests.rs"

[[ancres]]
ancre   = "features"
contenu = "mod storage;"

[[ancres]]
ancre   = "state_champs"
contenu = """
#[allow(dead_code)]
pub storage: std::sync::Arc<dyn crate::storage::Storage>,
"""

[[ancres]]
ancre   = "state_init"
contenu = "storage: crate::storage::depuis_config()?,"

[[dependances]]
nom     = "async-trait"
version = "0.1"

[[dependances]]
nom     = "thiserror"
version = "2.0"

[[dependances]]
nom     = "aws-sdk-s3"
version = "1.144"

[cargo.tokio]
features = ["fs"]

[[config]]
fichier = "config/default.toml"
section = "storage"
contenu = """
backend = "fs"
racine = "./stockage"
"""

[[env]]
cle         = "RBS_STORAGE__BUCKET"
valeur      = "demo"
commentaire = "Backend `s3` : sans effet tant que storage.backend vaut \"fs\"."

[[env]]
cle    = "RBS_STORAGE__ACCESS_KEY_ID"
valeur = "changez-moi"

[[env]]
cle    = "RBS_STORAGE__SECRET_ACCESS_KEY"
valeur = "changez-moi"

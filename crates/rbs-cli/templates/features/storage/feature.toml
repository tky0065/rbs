[feature]
description = "stockage d'objets : un trait à cinq méthodes, deux backends — fichiers et S3"

[[files]]
source      = "mod.rs.jinja"
destination = "src/modules/storage/mod.rs"

[[files]]
source      = "files.rs.jinja"
destination = "src/modules/storage/files.rs"

[[files]]
source      = "s3.rs.jinja"
destination = "src/modules/storage/s3.rs"

[[files]]
source      = "tests/mod.rs.jinja"
destination = "src/modules/storage/tests/mod.rs"

[[files]]
source      = "tests/files.rs.jinja"
destination = "src/modules/storage/tests/files.rs"

[[files]]
source      = "tests/s3.rs.jinja"
destination = "src/modules/storage/tests/s3.rs"

[[anchors]]
anchor  = "modules"
content = "pub mod storage;"

[[anchors]]
anchor  = "state_champs"
content = "pub storage: std::sync::Arc<dyn crate::modules::storage::Storage>,"

[[anchors]]
anchor  = "state_init"
content = "storage: crate::modules::storage::from_config()?,"

# Sans cette sonde, `/health` répondrait `ok` sur un bucket injoignable et l'orchestrateur
# garderait le pod en rotation.
[[anchors]]
anchor  = "health_probes"
content = """
rbs_core::health::Probe::new(
    "storage",
    crate::modules::storage::probe(state.storage()),
),
"""

[[dependencies]]
name    = "async-trait"
version = "0.1"

[[dependencies]]
name    = "thiserror"
version = "2.0"

[[dependencies]]
name    = "aws-sdk-s3"
version = "1.146"

# `get` rend l'objet en flux : `bytes` en porte les morceaux, `futures-util` met le flux
# en boîte, `tokio-util` lit un fichier ou un corps S3 morceau par morceau.
[[dependencies]]
name    = "bytes"
version = "1.12"

[[dependencies]]
name    = "futures-util"
version = "0.3"

[[dependencies]]
name     = "tokio-util"
version  = "0.7"
features = ["io"]

[cargo.tokio]
features = ["fs"]

[[config]]
file    = "config/default.toml"
section = "storage"
content = """
backend = "fs"
root = "./storage"
"""

[[env]]
key     = "RBS_STORAGE__BUCKET"
value   = "demo"
comment = "Backend `s3` : sans effet tant que storage.backend vaut \"fs\"."

[[env]]
key   = "RBS_STORAGE__ACCESS_KEY_ID"
value = "changez-moi"

[[env]]
key   = "RBS_STORAGE__SECRET_ACCESS_KEY"
value = "changez-moi"

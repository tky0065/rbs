[feature]
description = "une application Vue 3 servie par le binaire, et une page d'amorçage tant qu'elle n'est pas construite"
# Le CLI n'exécute rien : le client se construit de la main du développeur. Ces trois
# lignes sont donc les seules à dire le geste, et la page d'amorçage les répète à qui
# démarre le binaire sans les avoir lues.
next_steps = [
  "cd frontend && npm install",
  "{% if lang == 'en' %}npm run build (or npm run dev, which serves the client on its own port){% else %}npm run build (ou npm run dev, qui sert le client sur son propre port){% endif %}",
  "{% if lang == 'en' %}cargo run: the binary serves the build, and until then a page that names what is left to type{% else %}cargo run : le binaire sert le build, et jusque-là une page qui nomme ce qu'il reste à taper{% endif %}",
]

[[files]]
source      = "mod.rs.jinja"
destination = "src/modules/frontend/mod.rs"

[[files]]
source      = "config.rs.jinja"
destination = "src/modules/frontend/config.rs"

[[files]]
source      = "amorcage.rs.jinja"
destination = "src/modules/frontend/amorcage.rs"

[[files]]

[[files]]
source      = "tests.rs.jinja"
destination = "src/modules/frontend/tests.rs"

# Le client lui-même. Son arbre est plat et sans surprise : c'est celui qu'un
# `npm create vue` produirait, pour qu'un développeur qui connaît Vue n'ait rien à
# réapprendre — et parce que `rbs generate crud` viendra y déposer des écrans, ce qui fige
# la disposition autant que le ferait une API.
#
# Les composants d'interface sont figés ici plutôt que tirés d'un générateur : le manifeste
# npm ne porte aucune dépendance vers la ligne de commande qui a servi à les produire, et
# le thème que celle-ci importe depuis son propre paquet est inliné dans
# `src/assets/main.css`. La contrepartie est une tâche de mise à jour récurrente.
#
# Trois versions du manifeste npm s'écartent du dernier stable, chacune sur une
# incompatibilité vérifiée plutôt que par prudence : `typescript`, dont la 7 ne publie plus
# le module que `vue-tsc` charge ; `@vueuse/core`, que `reka-ui` tire en 14 et qui
# doublerait dans le bundle en 15 ; et `@vue/devtools-api`, pair non optionnel de Pinia 4
# qu'aucun projet neuf ne pose de lui-même. Le détail de chacune est écrit dans le
# `README.md` livré au projet, et non ici : c'est son propriétaire, et non le mainteneur de
# `rbs`, qui décidera un jour de les relever.
#
# La police vient de ce manifeste et non des templates : le mécanisme est UTF-8, et aucun
# fichier de police n'en sortirait. `--font-sans` la place devant une pile système
# complète, qui reprend la main si l'installation n'a pas eu lieu.
#
# `tw-animate-css` ne figure pas dans la pile choisie, et n'est pas non plus un choix :
# c'est la feuille où vivent les `animate-in`, `slide-in-from-*` et `fade-out-0` que les
# composants livrés écrivent dans leurs classes. Sans elle, ces classes ne désignent rien,
# une boîte de dialogue apparaît sans transition et un panneau latéral ne dit plus de quel
# bord il vient.

[[files]]
source      = "client/README.md.jinja"
destination = "frontend/README.md"

[[files]]
source      = "client/package.json.jinja"
destination = "frontend/package.json"


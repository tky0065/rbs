[feature]
description = "le shell d'administration : connexion, jetons, garde de route et les deux stores de l'application"
# Le socle porte l'application, son routeur et son thème ; `auth` porte les routes que ce
# shell appelle, la table des comptes et la paire de jetons. Ni l'une ni l'autre ne se
# déduit : sans la première il n'y a rien où se monter, sans la seconde rien à appeler.
# `auth` entraîne à son tour `rate-limit` et `mail`, que le plan nomme avant d'écrire.
requires = ["frontend", "auth"]
# Le client typé est engendré depuis le document OpenAPI du projet et non livré ici : le
# contrat d'un projet n'est pas celui d'un autre, et un client figé mentirait dès la
# première route ajoutée. C'est la première ligne parce que la vérification des types du
# client en dépend — le shell l'importe, et rien d'autre ne parle HTTP.
#
# Les gestes du socle s'affichent avant ceux-ci, `npm run build` compris : la ligne qui
# suit la commande dit donc l'ordre, faute de quoi la construction échouerait sur un
# import que rien n'a encore écrit.
next_steps = [
  "rbs generate client --lang ts --out frontend/src/api",
  "{% if lang == 'en' %}that one comes before npm run build: the shell imports the generated client, and the type check stops without it{% else %}celle-ci passe avant npm run build : le shell importe le client engendré, et la vérification des types s'arrête sans lui{% endif %}",
  "{% if lang == 'en' %}then cargo run: the sign-in screen is served at /admin{% else %}puis cargo run : l'écran de connexion est servi sur /admin{% endif %}",
]

# Le fragment dépose ses fichiers dans l'arbre que le socle a posé, et n'en redépose
# aucun : une application, deux régimes de route.
#
# L'espace lui-même se monte dans le socle par découverte et non par une ancre : un
# fragment ne peut pas redéposer un fichier qu'un autre a posé, et le routeur du socle lit
# donc tout module nommé `montage.ts` sous `src/` — il n'en trouve aucun tant que ce
# fragment n'est pas posé. Les deux ancres ci-dessous font l'inverse : elles montent un
# écran *dans* cet espace, et ce fragment les emploie pour son écran de démonstration
# exactement comme `rbs generate crud` les emploiera pour une table.

[[files]]
source      = "client/src/api/jetons.ts.jinja"
destination = "frontend/src/api/jetons.ts"

[[files]]
source      = "client/src/api/index.ts.jinja"
destination = "frontend/src/api/index.ts"

[[files]]
source      = "client/src/stores/authentification.ts.jinja"
destination = "frontend/src/stores/authentification.ts"

[[files]]
source      = "client/src/stores/interface.ts.jinja"
destination = "frontend/src/stores/interface.ts"

[[files]]
source      = "client/src/admin/montage.ts.jinja"
destination = "frontend/src/admin/montage.ts"

[[files]]
source      = "client/src/admin/garde.ts.jinja"
destination = "frontend/src/admin/garde.ts"

[[files]]
source      = "client/src/admin/rail.ts.jinja"
destination = "frontend/src/admin/rail.ts"

[[files]]
source      = "client/src/admin/document.ts.jinja"
destination = "frontend/src/admin/document.ts"

[[files]]
source      = "client/src/admin/textes.ts.jinja"
destination = "frontend/src/admin/textes.ts"

# La lecture du jeton d'un lien de courriel, que deux écrans publics partagent.
[[files]]
source      = "client/src/admin/lien.ts.jinja"
destination = "frontend/src/admin/lien.ts"

[[files]]
source      = "client/src/admin/Shell.vue.jinja"
destination = "frontend/src/admin/Shell.vue"

[[files]]
source      = "client/src/admin/vues/Connexion.vue.jinja"
destination = "frontend/src/admin/vues/Connexion.vue"

# Les trois autres pages publiques du shell. Une garde sans écran d'inscription, de
# réinitialisation et de vérification laisserait dehors qui n'a pas encore de compte, qui a
# perdu son mot de passe, ou dont l'adresse attend sa preuve — et les quatre routes d'`auth`
# qui les servent n'auraient aucun appelant.
[[files]]
source      = "client/src/admin/vues/Inscription.vue.jinja"
destination = "frontend/src/admin/vues/Inscription.vue"

[[files]]
source      = "client/src/admin/vues/Reinitialisation.vue.jinja"
destination = "frontend/src/admin/vues/Reinitialisation.vue"

[[files]]
source      = "client/src/admin/vues/Verification.vue.jinja"
destination = "frontend/src/admin/vues/Verification.vue"

[[files]]
source      = "client/src/admin/vues/TableauDeBord.vue.jinja"
destination = "frontend/src/admin/vues/TableauDeBord.vue"

[[files]]
source      = "client/src/admin/vues/Sessions.vue.jinja"
destination = "frontend/src/admin/vues/Sessions.vue"

[[files]]
source      = "client/src/admin/vues/Profil.vue.jinja"
destination = "frontend/src/admin/vues/Profil.vue"

# L'écran patron, rendu ici pour l'entité de démonstration et nulle part ailleurs : c'est
# le même fichier que `rbs generate crud` rendra pour chaque table. Un projet neuf n'a
# aucune table à administrer, et sans cet écran son espace d'administration s'ouvrirait
# sur un tableau de bord sans rien montrer de ce que la commande donnera ensuite.
[[files]]
source      = "client/src/admin/vues/Patron.vue.jinja"
destination = "frontend/src/admin/vues/Demonstration.vue"

# Les deux lignes viennent du même endroit que l'écran lui-même — `src/ecran.rs` — et non
# de ce manifeste : la route et l'entrée de rail d'un écran engendré doivent être celles de
# l'écran de démonstration, à l'entité près, et deux écritures de la même ligne finiraient
# par diverger comme deux gabarits l'auraient fait.
[[anchors]]
anchor  = "admin_routes"
content = "{@ ecran.montage @}"

[[anchors]]
anchor  = "admin_rail"
content = "{@ ecran.rail @}"

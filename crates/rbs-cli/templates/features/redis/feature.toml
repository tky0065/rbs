[feature]
description = "cache Redis : pool paresseux partagé par l'état, valeurs typées par serde"

[[files]]
source      = "mod.rs.jinja"
destination = "src/cache/mod.rs"

[[files]]
source      = "config.rs.jinja"
destination = "src/cache/config.rs"

[[files]]
source      = "tests.rs.jinja"
destination = "src/cache/tests.rs"

[[anchors]]
anchor  = "features"
content = "pub mod cache;"

[[anchors]]
anchor  = "state_champs"
content = "pub cache: crate::cache::Cache,"

[[anchors]]
anchor  = "state_init"
content = "cache: crate::cache::Cache::from_config()?,"

[[dependencies]]
name     = "redis"
version  = "1.6"
features = ["tokio-comp"]

[[dependencies]]
name    = "deadpool-redis"
version = "0.23"

[[dependencies]]
name    = "serde_json"
version = "1.0"

# `tokio::time` sert à l'expiration, que les tests du fragment attendent réellement.
# `redis`/`tokio-comp` l'active par unification, mais une feature dont le projet a besoin
# ne se prend pas dans la dépendance d'un tiers, qui peut la retirer sans prévenir.
[cargo.tokio]
features = ["time"]

[[config]]
file    = "config/default.toml"
section = "cache"
content = """
url = "redis://127.0.0.1:6379"
ttl_secs = 300
"""

# Le port publié est celui que `config/default.toml` annonce ci-dessus : le cache tourne
# sur l'hôte comme le serveur, et n'a pas de réseau de compose pour l'atteindre.
[[anchors]]
anchor  = "services"
content = """
redis:
  image: redis:8-alpine
  ports:
    - "6379:6379"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30
"""

[package]
name = "rbs-cli"
description = "Le binaire `rbs` : génération et maintenance de projets Axum + SeaORM."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Les deux binaires et la bibliothèque sont découverts par cargo depuis `src/` : une
# cible déclarée ici les redéclarerait sans rien ajouter. `src/bin/rbs-cli.rs` porte la
# raison d'être du second nom.

[dependencies]
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
console.workspace = true
cron.workspace = true
include_dir.workspace = true
inquire.workspace = true
minijinja.workspace = true
rand.workspace = true
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml_edit = { workspace = true, features = ["serde"] }
watchexec.workspace = true
watchexec-events.workspace = true
watchexec-signals.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
testcontainers.workspace = true

# `cargo binstall rbs-cli` télécharge l'archive que la release GitHub du tag porte, au lieu
# de compiler. Le nom `rbs-<cible>` est celui que `.github/workflows/release.yml` donne à
# chaque archive : l'un ne change pas sans l'autre.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rbs-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

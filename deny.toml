# Contrôles de cargo-deny sur le graphe des deux crates publiées. Les advisories restent à
# `cargo audit` (job `audit` de ci.yml, exceptions dans `.cargo/audit.toml`) : les tenir
# aussi ici ferait deux listes d'exceptions à garder d'accord. Le job `deny` ne lance donc
# que `check licenses sources bans`.

[graph]
all-features = true

[licenses]
# Les licences réellement présentes dans le graphe (`cargo deny --all-features list -l
# license`), toutes permissives et compatibles avec `MIT OR Apache-2.0`. Une dépendance
# qui entre sous une autre licence fait échouer le job : c'est une décision à prendre, pas
# un avertissement à lire.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Deux versions d'une même crate alourdissent la compilation sans rien casser : signalées,
# non bloquantes.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

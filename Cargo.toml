[workspace]
members = ["crates/rbs-core", "crates/rbs-cli"]

# Les projets d'`examples/` déclarent leur propre `[workspace]` : Cargo interdit
# l'imbrication. La CI les compile par une étape dédiée.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/tky0065/rbs"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# `string` : les valeurs proposées à la complétion de `rbs add` sont les fragments
# embarqués, énumérés à l'exécution — sans cette feature, clap n'accepte que des chaînes
# `'static`.
clap = { version = "4.6.6", features = ["derive", "string"] }
clap_complete = "4.6.9"
console = "0.16.4"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
include_dir = "0.7.4"
inquire = "0.9.4"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
minijinja = { version = "2.24.0", features = ["custom_syntax"] }
nu-ansi-term = "0.50.3"
rand = "0.10.2"
# Aucun pilote ici : `rbs-core` les expose en features, et le projet engendré choisit
# le sien. Un pilote épinglé au workspace ferait compiler PostgreSQL à un projet MySQL,
# les features de Cargo s'unifiant sur toute la dépendance.
sea-orm = { version = "2.0.2", features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = "1.53.1"
toml_edit = "0.25.13"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
utoipa = "5.5.0"
validator = { version = "0.21.0", features = ["derive"] }
watchexec = "8.4.0"
watchexec-events = "6.1.2"
watchexec-signals = "5.1.1"

assert_cmd = "2.2.2"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }

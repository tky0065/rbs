[workspace]
members = ["crates/rbs-core", "crates/rbs-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/tky0065/rbs"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
include_dir = "0.7.4"
inquire = "0.9.4"
minijinja = { version = "2.24.0", features = ["custom_syntax"] }
nu-ansi-term = "0.50.3"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
toml_edit = "0.25.13"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
utoipa = "5.5.0"
utoipa-swagger-ui = "9.0.2"
validator = { version = "0.21.0", features = ["derive"] }

assert_cmd = "2.2.2"
tempfile = "3.27.0"
testcontainers = "0.28.0"

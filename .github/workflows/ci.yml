name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (intégration)
        run: cargo test --workspace -- --ignored

      # Les templates que le binaire embarque vivent sous `crates/rbs-cli` : `cargo
      # package` n'emporte aucun fichier extérieur au paquet. Rien dans une compilation
      # locale ne le rappelle — seul le dry-run le constate, et la régression passerait
      # inaperçue jusqu'au jour de la publication.
      - name: cargo publish (dry-run)
        run: |
          cargo publish --dry-run -p rbs-core
          cargo publish --dry-run -p rbs-cli

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Les contrôles de dépôt — format, exemples, dry-run de publication — ne dépendent pas
  # de la plateforme. Les tripler coûterait des minutes de runner sans rien démontrer de
  # plus, et c'est ici que vivent les seules étapes qui exigent Docker.
  linux:
    name: fmt · clippy · test · intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo test (intégration)
        run: cargo test --workspace --all-features -- --ignored

      # La documentation ne contient aucun bloc de code écrit à la main : ses extraits
      # sont lus dans `examples/`. Un exemple qui ne compile plus fait donc mentir des
      # pages entières, et le workspace racine l'exclut — un projet généré déclare son
      # propre `[workspace]`, que Cargo refuse d'imbriquer.
      #
      # La boucle plutôt qu'un step par exemple : le jour où l'on en ajoute un, l'oublier
      # ici ne se verrait pas — la page qu'il alimente mentirait sans que rien n'échoue.
      - name: cargo clippy (examples)
        run: |
          for exemple in examples/*/; do
            echo "::group::$exemple"
            (cd "$exemple" && cargo clippy --workspace --all-targets -- -D warnings)
            echo "::endgroup::"
          done

      # La garde de publication n'est exercée, en conditions réelles, que le jour d'un tag
      # posé de travers — trop tard pour découvrir qu'elle laisse passer. On la mord donc
      # ici sur ses deux verdicts, à chaque commit.
      - name: garde de version (les deux verdicts)
        run: |
          version=$(cargo pkgid -p rbs-core | sed 's/.*[@#]//')
          if ! .github/scripts/garde-version.sh "v$version"; then
            echo "la garde refuse le tag concordant v$version" >&2
            exit 1
          fi
          if .github/scripts/garde-version.sh v99.0.0; then
            echo "la garde accepte le tag discordant v99.0.0" >&2
            exit 1
          fi

      # Les templates que le binaire embarque vivent sous `crates/rbs-cli` : `cargo
      # package` n'emporte aucun fichier extérieur au paquet. Rien dans une compilation
      # locale ne le rappelle — seul le dry-run le constate, et la régression passerait
      # inaperçue jusqu'au jour de la publication.
      - name: cargo publish (dry-run)
        run: |
          cargo publish --dry-run --locked -p rbs-core
          cargo publish --dry-run --locked -p rbs-cli

  # Ce que ces deux plateformes prouvent, c'est que rbs manipule les chemins sans
  # supposer `/` — la faute que ce projet commettrait, puisqu'il écrit des arborescences.
  #
  # `--ignored` reste sur Linux : ces tests démarrent PostgreSQL via testcontainers, or
  # les runners macOS n'exposent aucun démon Docker et `windows-latest` ne fait tourner
  # que des conteneurs Windows. Les y lancer prouverait l'absence de Docker, pas un bug.
  portabilite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un échec sous Windows ne doit pas annuler macOS : les deux plateformes échouent
      # pour des raisons différentes, et masquer l'une oblige à deux allers-retours.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

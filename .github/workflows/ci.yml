name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Les contrôles de dépôt — format, exemples, dry-run de publication — ne dépendent pas
  # de la plateforme. Les tripler coûterait des minutes de runner sans rien démontrer de
  # plus. Les étapes qui exigent Docker vivent dans `integration`, qui les joue sur deux
  # versions de PostgreSQL pendant que celui-ci tourne.
  linux:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      # `clippy` et les tests disent que le dépôt compile contre lui-même ; ils ne disent
      # rien des projets déjà bâtis sur la version parue. Un instantané textuel de l'API
      # ne répondrait qu'à « l'API a-t-elle changé ? », question à laquelle un ajout
      # compatible répond oui pour rien : l'outil répond « est-ce une rupture ? », en
      # confrontant la surface courante à celle de la dernière version sur crates.io.
      #
      # `rbs-core` seule : `rbs-cli` livre un binaire, et que sa bibliothèque soit visible
      # est un détail de construction, pas une offre de compatibilité.
      #
      # `all-features` parce que `auth` gouverne à lui seul cinq entrées publiques —
      # `hash`, `jwt`, `token`, `Identity`, `HasAuth`. Sous les features par défaut,
      # renommer `token::fingerprint` passe vert : la surface examinée n'en contient rien.
      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rbs-core
          feature-group: all-features

      # La documentation ne contient aucun bloc de code écrit à la main : ses extraits
      # sont lus dans `examples/`. Un exemple qui ne compile plus fait donc mentir des
      # pages entières, et le workspace racine l'exclut — un projet généré déclare son
      # propre `[workspace]`, que Cargo refuse d'imbriquer.
      #
      # La boucle plutôt qu'un step par exemple : le jour où l'on en ajoute un, l'oublier
      # ici ne se verrait pas — la page qu'il alimente mentirait sans que rien n'échoue.
      - name: cargo clippy (examples)
        run: |
          for exemple in examples/*/; do
            echo "::group::$exemple"
            (cd "$exemple" && cargo clippy --workspace --all-targets -- -D warnings)
            echo "::endgroup::"
          done

      # La garde de publication n'est exercée, en conditions réelles, que le jour d'un tag
      # posé de travers — trop tard pour découvrir qu'elle laisse passer. On la mord donc
      # ici sur ses deux verdicts, à chaque commit.
      - name: garde de version (les deux verdicts)
        run: |
          version=$(cargo pkgid -p rbs-core | sed 's/.*[@#]//')
          if ! .github/scripts/garde-version.sh "v$version"; then
            echo "la garde refuse le tag concordant v$version" >&2
            exit 1
          fi
          if .github/scripts/garde-version.sh v99.0.0; then
            echo "la garde accepte le tag discordant v99.0.0" >&2
            exit 1
          fi

      # Les templates que le binaire embarque vivent sous `crates/rbs-cli` : `cargo
      # package` n'emporte aucun fichier extérieur au paquet. Rien dans une compilation
      # locale ne le rappelle — seul le dry-run le constate, et la régression passerait
      # inaperçue jusqu'au jour de la publication.
      - name: cargo publish (dry-run)
        run: |
          cargo publish --dry-run --locked -p rbs-core
          cargo publish --dry-run --locked -p rbs-cli

  # Deux versions, et non la seule livrée : `postgres:18-alpine` est ce que le
  # `docker-compose.yml` engendré épingle, mais le plancher que `rbs doctor` fait respecter
  # est la 14. N'éprouver que la 18 laissait ce plancher promis sans être tenu — une
  # régression qui exigerait la 18 passait verte et ne se découvrait que chez l'utilisateur.
  #
  # `RBS_TEST_PG` est lue au démarrage du conteneur : les deux branches partagent le même
  # code compilé et ne diffèrent que par ce que Docker télécharge.
  #
  # Les deux branches tournent en parallèle : la durée d'horloge de la CI ne bouge pas, seul
  # le nombre de minutes de runner double. C'est le prix de la promesse.
  integration:
    name: intégration · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      # Un échec sur le plancher ne doit pas masquer la version livrée, ni l'inverse : ce
      # sont deux verdicts distincts, et n'en obtenir qu'un obligerait à deux allers-retours.
      fail-fast: false
      matrix:
        postgres: ["18", "14"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (intégration)
        env:
          RBS_TEST_PG: ${{ matrix.postgres }}
        run: cargo test --workspace --all-features --no-fail-fast -- --ignored

  # Un audit ne compile rien : le tenir hors du job `linux` le rend en quelques secondes,
  # et son verdict ne se perd pas derrière vingt minutes de compilation.
  #
  # `cargo audit` nu plutôt qu'une action qui l'enveloppe : c'est la commande que le
  # développeur lance chez lui, et elle lit le même `.cargo/audit.toml`, où chaque advisory
  # tolérée dit ce qui la lèverait. Deux verdicts divergents seraient exactement le genre de
  # mensonge que ce job existe pour interdire.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # `--deny warnings` : une advisory « unmaintained » ou « yanked » n'est pas une
      # vulnérabilité, mais laissée en avertissement elle passait le job sans que personne
      # ne la lise. Chaque tolérance est désormais un choix inscrit dans
      # `.cargo/audit.toml`, avec la commande qui dira qu'elle peut partir ; tout le reste
      # échoue.
      - name: cargo audit
        run: cargo audit --deny warnings

  # `rust-version` est une promesse faite à qui installe, et rien ne la tenait : tous les
  # autres jobs tournent sur `stable`, qui satisfait n'importe quel plancher. Une dépendance
  # qui monte sa MSRV cassait donc les installations sans que la CI le voie.
  #
  # Un `check` et non la suite de tests : la question posée est « ce plancher compile-t-il ? »,
  # à quoi le typage répond en entier. `--locked` en plus, pour que le job échoue sur la
  # résolution versionnée plutôt que d'en inventer silencieusement une autre.
  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.94

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-features --all-targets --locked

  # Ce que ces deux plateformes prouvent, c'est que rbs manipule les chemins sans
  # supposer `/` — la faute que ce projet commettrait, puisqu'il écrit des arborescences.
  #
  # `--ignored` reste sur Linux : ces tests démarrent PostgreSQL via testcontainers, or
  # les runners macOS n'exposent aucun démon Docker et `windows-latest` ne fait tourner
  # que des conteneurs Windows. Les y lancer prouverait l'absence de Docker, pas un bug.
  portabilite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un échec sous Windows ne doit pas annuler macOS : les deux plateformes échouent
      # pour des raisons différentes, et masquer l'une oblige à deux allers-retours.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

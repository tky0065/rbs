name: Docs

# La toolchain Node vit sous `docs/` et n'entre pas dans `ci.yml` : CONTRIBUTING garantit
# qu'on peut contribuer au code sans installer Node, et cette garantie se vérifie en
# comptant les occurrences de Node dans le workflow Rust.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/superpowers/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '!docs/superpowers/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: build du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests du plugin d'extraits
        run: npm test

      # Le build échoue sur un lien mort (`onBrokenLinks: 'throw'`) et construit les deux
      # locales : c'est lui qui tient la parité FR/EN, qu'aucun test ne couvre.
      #
      # `clear` d'abord : le cache de Docusaurus est indexé sur les fichiers Markdown, et
      # un extrait dont la source a bougé dans `examples/` reste servi depuis le cache.
      # Un checkout de CI est neuf, donc la question ne se pose pas ici — mais faire
      # dépendre le garde-fou de cette circonstance le rendrait faux le jour où le cache
      # serait restauré entre deux runs.
      - name: build
        run: |
          npm run clear
          npm run build

      # `working-directory` ne vaut que pour les étapes `run` : le chemin d'une action se
      # résout depuis la racine du dépôt, d'où `docs/build` et non `build`.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: déploiement sur Pages
    needs: build
    # Une pull request construit le site pour le vérifier ; elle ne publie pas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Les permissions vivent ici, pas au niveau du workflow : le job de build n'a aucun
    # besoin d'écrire sur Pages, et les lui accorder n'élargirait que la surface d'attaque.
    permissions:
      pages: write
      id-token: write

    # Groupe distinct de celui du build. Celui-ci annule les runs en cours, ce qui convient
    # à une compilation et laisse un déploiement Pages interrompu en vol dans un état que
    # GitHub ne reprend pas.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
